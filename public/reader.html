<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đọc báo in — Nội bộ (prototype)</title>
<link rel="stylesheet" href="/css/style.css"></head>
<body>
<div class="reader-head">
  <a href="/bao-in">← Trở lại</a>
  <b id="title">Đang tải…</b>
  <button id="mode-flip">Chế độ Lật</button>
  <button id="mode-read">Chế độ Đọc</button>
  <button id="page-mode">Chế độ: 2 trang</button>
  <button id="fullscreen">Toàn màn hình</button>
  <a id="download" href="#" target="_blank">Tải PDF mẫu</a>
</div>

<div id="flip-wrap"><div id="flip-book"></div></div>
<div class="toolbar" id="flip-toolbar">
  <button id="first">Về đầu</button><button id="prev">‹</button>
  <input id="page-input" inputmode="numeric" aria-label="Số trang">
  <span id="page-label"></span>
  <button id="next">›</button><button id="last">Về cuối</button>
</div>
<div id="thumbs"></div>

<div id="read-wrap">
  <div class="toolbar">
    <button id="read-prev">‹ Trang trước</button>
    <button id="zoom-out">Thu nhỏ</button>
    <span id="zoom-label">100%</span>
    <button id="zoom-in">Phóng to</button>
    <button id="read-next">Trang sau ›</button>
    <button id="read-exit">Quay lại chế độ Lật</button>
  </div>
  <div id="read-scroll"><canvas id="read-canvas"></canvas></div>
  <p class="note">Chế độ Đọc: cuộn chuột lên = phóng to, xuống = thu nhỏ (mỗi nấc ×1,5, tâm theo con trỏ).
  Khi đã phóng to, bấm giữ và kéo trang để pan tới vị trí đọc — kéo lúc này không lật trang.
  Sang trang mới, zoom reset về vừa khung.</p>
</div>

<script src="/vendor/page-flip.js"></script>
<script type="module" src="/js/reader.js"></script>
</body></html>

<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
</head>
<body>
<div class="utilitybar">
  <nav class="utilitybar-links" aria-label="Chuyên trang">
    <a href="/truyen-hinh">📺 TRUYỀN HÌNH</a>
    <a href="/phat-thanh">📻 PHÁT THANH</a>
    <a href="/bao-in">📰 BÁO IN</a>
    <a href="/nen-tang-so">▦ NỀN TẢNG SỐ</a>
    <a href="/su-kien">📅 SỰ KIỆN</a>
    <a href="/tuong-thuat">🎙️ TƯỜNG THUẬT</a>
  </nav>
  <div class="utilitybar-right">
    <span class="lang-note" title="Bản tiếng Anh chưa có">🌐 ENGLISH</span>
    <span id="utility-social" class="utility-social" hidden></span>
    <a href="/admin.html">👤 ĐĂNG NHẬP</a>
  </div>
</div>

<header class="masthead">
  <a href="/" class="brand"><img id="brand-logo" class="brand-logo" alt="" hidden><span class="brand-name" hidden>TÒA SOẠN HỘI TỤ</span></a>
  <nav class="masthead-actions" aria-label="Tiện ích">
    <span class="masthead-date" data-topline-date></span>
    <a href="/#news-latest" class="news-bell"><span class="news-bell-icon"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 3a6 6 0 0 0-6 6v2.6l-2 2.4h16l-2-2.4V9a6 6 0 0 0-6-6Z" fill="none" stroke="#c00" stroke-width="1.7" stroke-linejoin="round"/><path d="M10 20a2.2 2.2 0 0 0 4 0" fill="none" stroke="#c00" stroke-width="1.7" stroke-linecap="round"/></svg></span> Tin mới</a>
  </nav>
</header>
<section class="live-section">
  <div class="live-head">
    <h2 class="live-title">PHÁT THANH TRỰC TUYẾN</h2>
    <div class="live-head-actions">
      <a class="sched-btn" href="/lich-phat-song">LỊCH PHÁT SÓNG</a>
      <input type="date" id="sched-date" aria-label="Chọn ngày xem lịch">
    </div>
  </div>
  <h3 id="channel-name" class="live-channel">Đang tải kênh…</h3>
  <p id="channel-desc" class="live-desc"></p>
  <div class="live-grid">
    <div class="live-player-col">
      <div class="live-player-wrap radio-poster">
        <span class="live-badge">● TRỰC TIẾP</span>
        <button id="radio-play" class="radio-play-btn" type="button" aria-label="Phát / Tạm dừng">▶</button>
        <div>
          <div class="radio-poster-kicker">PHÁT THANH TRỰC TUYẾN</div>
          <div class="radio-poster-name">Báo và Phát thanh, Truyền hình Tuyên Quang</div>
        </div>
      </div>
      <audio id="player"></audio>
      <div id="lc-mount"></div>
      <div id="lc-channels" class="lc-channels" aria-label="Danh sách kênh"></div>
      <div id="player-wrap"></div>
      <p id="now-playing" class="live-now"></p>
      <p id="replay-bar" class="replay-bar" style="display:none">XEM LẠI · <span id="replay-title"></span> <button type="button" id="back-live">Về trực tiếp</button></p>
      <p id="player-msg" class="note" style="display:none"></p>
    </div>
    <div class="sched-col">
      <div id="schedule" class="sched-list"><p class="sched-empty">Đang tải lịch…</p></div>
    </div>
  </div>
</section>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>

<script src="/js/radio.js?v=20261105-4"></script>
<script src="/js/header.js?v=20261102-7"></script>
</body></html>

<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phát thanh trực tuyến</title>
<link rel="stylesheet" href="/css/style.css?v=20261026-3">
<link rel="stylesheet" href="/css/live.css?v=20261026-6"><link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
</head>
<body>
<header class="top"><h1>Phát thanh trực tuyến</h1><p><a href="/" aria-label="Trang chủ">⌂</a> · <a href="/bao-in">Báo in</a> · <a href="/truyen-hinh">Truyền hình</a> · <a href="/phat-thanh">Phát thanh</a> · <a href="/lich-phat-song">Lịch phát sóng</a> · <a href="/admin.html">CMS</a></p></header>
<section class="live-section">
  <div class="live-head">
    <h2 class="live-title">PHÁT THANH TRỰC TUYẾN</h2>
    <div class="live-head-actions">
      <a class="sched-btn" href="/lich-phat-song">LỊCH PHÁT SÓNG</a>
      <input type="date" id="sched-date" aria-label="Chọn ngày xem lịch">
    </div>
  </div>
  <h3 id="channel-name" class="live-channel">Đang tải kênh…</h3>
  <p id="channel-desc" class="live-desc"></p>
  <div class="live-grid">
    <div class="live-player-col">
      <div class="live-player-wrap radio-poster">
        <span class="live-badge">● TRỰC TIẾP</span>
        <button id="radio-play" class="radio-play-btn" type="button" aria-label="Phát / Tạm dừng">▶</button>
        <div>
          <div class="radio-poster-kicker">PHÁT THANH TRỰC TUYẾN</div>
          <div class="radio-poster-name">Báo và Phát thanh, Truyền hình Tuyên Quang</div>
        </div>
      </div>
      <audio id="player" controls></audio>
      <div id="player-wrap"></div>
      <p id="now-playing" class="live-now"></p>
      <p id="replay-bar" class="replay-bar" style="display:none">Đang xem lại: <span id="replay-title"></span> <button type="button" id="back-live">Về live</button></p>
      <p id="player-msg" class="note" style="display:none"></p>
    </div>
    <div class="sched-col">
      <div id="schedule" class="sched-list"><p class="sched-empty">Đang tải lịch…</p></div>
    </div>
  </div>
</section>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<script src="/js/stream-player.js?v=20261026-6"></script>
<script src="/js/live-epg.js?v=20261027-4"></script>
<script src="/js/radio.js?v=20261026-6"></script>
</body></html>

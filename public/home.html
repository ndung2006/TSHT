<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tòa soạn hội tụ</title>
<meta name="description" content="Tòa soạn hội tụ: truyền hình, phát thanh, báo in và tin tức.">
<link rel="canonical" href="https://tsht.vtctech.xyz/">
<meta property="og:type" content="website">
<meta property="og:title" content="Tòa soạn hội tụ">
<meta property="og:description" content="Tòa soạn hội tụ: truyền hình, phát thanh, báo in và tin tức.">
<meta property="og:url" content="https://tsht.vtctech.xyz/">
<link rel="stylesheet" href="/css/home.css?v=20261105-2">
<link rel="stylesheet" href="/css/header.css?v=20261106-1">
<link rel="stylesheet" href="/css/footer.css?v=20261105-1">
<link rel="stylesheet" href="/css/live-controls.css?v=20261105-4"><link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
</head>
<body id="top">
<!-- Trang chủ TSHT — khung bố cục theo cấu trúc trang chủ kiểu Tuyên Quang TV
     (chỉ cấu trúc, không copy logo/ảnh/bài viết của trang tham khảo).
     Nội dung thật: số báo đã xuất bản, chương trình TV/radio đang phát,
     và tin tức (chuyên mục + bài viết từ CMS Tin bài, qua /api/v2/news).
     Video, thời tiết và mạng xã hội CHƯA có nên chỉ hiện trạng thái chờ,
     không bịa. -->
<!-- @HEADER -->

<main class="wrap">
  <!-- Quang cao web_home_under_menu 1200x146 — Ngang duoi thanh menu -->
  <div class="ad-slot" data-ad-placement="web_home_under_menu" hidden></div>
  <!-- Quang cao home_top: dau trang chu -->
  <div class="ad-slot" data-ad-placement="home_top" hidden></div>
  <!-- Luong khoi trang chu do CMS quan ly (Layout blocks — tab Khoi trang
       chu trong Quan ly giao dien): thu tu + an/hien do config
       /api/v2/home-blocks quyet dinh, home.js sap xep lai cac section
       theo order; khong co config thi giu nguyen thu tu mac dinh duoi day.
       Cac khoi trung da go 2026-11-04: luoi Tin tieu diem duoi hero,
       dai Dang phat cu, cum TV/PHAT THANH TRUC TUYEN/VIDEO MOI,
       khoi Noi bat giua trang (bao in + BAN DOC QUAN TAM lap lan 2),
       danh sach Tin moi nhat tron chung (thay bang khoi chuyen muc). -->
  <div id="home-flow">
    <!-- Hero 3 cot: slider bai chinh giua + cot trai + BAN DOC QUAN TAM phai.
         Noi dung do home.js ve tu zone tieu-diem + tin moi nhat. -->
    <section id="block-hero" aria-label="Tin tức">
      <div id="news-featured">Đang tải…</div>
    </section>
    <section id="multimedia" class="mm-section" aria-label="Đa phương tiện">
      <div class="mm-top">
        <div class="mm-channels">
          <div id="mm-channels-tv"></div>
          <div id="mm-channels-radio"></div>
          <div id="mm-apps"></div>
        </div>
        <div class="mm-player">
          <div class="mm-media">
            <video id="mm-video" playsinline preload="metadata"></video>
            <div id="mm-radio-art" class="mm-radio-art" style="display:none">
              <div class="mm-eq" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
              <p id="mm-radio-name" class="mm-radio-name"></p>
              <p class="mm-radio-hint">Đang phát trực tiếp</p>
            </div>
            <audio id="mm-audio" preload="metadata" style="display:none"></audio>
          </div>
          <div id="lc-mount"></div>
          <div class="mm-badge">
            <span class="mm-live-dot" aria-hidden="true"></span>
            <span id="mm-badge-text" class="mm-badge-text"></span>
            <button type="button" id="mm-live-btn" class="mm-live-btn" style="display:none">● LIVE</button>
          </div>
          <p id="mm-msg" class="mm-msg" style="display:none"></p>
        </div>
        <div class="mm-sched">
          <div class="mm-sched-head">
            <h3><span aria-hidden="true">📅</span> LỊCH PHÁT SÓNG</h3>
            <select id="mm-sched-date" class="mm-sched-date" aria-label="Chọn ngày xem lịch"></select>
          </div>
          <div id="mm-sched-list" class="mm-sched-list"></div>
        </div>
      </div>
      <div id="mm-videos" class="mm-videos"></div>
    </section>
    <!-- Quang cao ben phai / duoi muc Da phuong tien (dinh kem khoi
         multimedia khi doi thu tu khoi). -->
    <div class="ad-slot" data-ad-placement="web_home_media_right" hidden></div>
    <div class="ad-slot" data-ad-placement="web_home_under_media" hidden></div>
    <!-- Vung 2 cot: trai 2/3 = khoi chuyen muc (CMS chon), phai 1/3 =
         khoi Thoi tiet + slot quang cao cot phai. Khoi chuyen muc do
         home.js ve tu config; chuyen muc chua co bai da xuat ban thi
         khoi do tu an, khong de khoang trong. -->
    <span id="tin-moi-nhat"></span>
    <div id="home-body">
      <div id="home-cat-left"></div>
      <aside id="home-side">
        <div id="home-weather-slot"></div>
        <div class="ad-slot" data-ad-placement="web_home_focus_right" hidden></div>
        <div class="ad-slot" data-ad-placement="web_home_weather_right" hidden></div>
        <div class="ad-slot" data-ad-placement="web_home_below_weather_1" hidden></div>
        <div class="ad-slot" data-ad-placement="web_home_below_weather_2" hidden></div>
      </aside>
    </div>
    <!-- Bao in moi nhat o cuoi trang, giu nguyen noi dung nhu truoc. -->
    <section id="block-epaper" aria-label="Báo in">
      <h2 class="section-title">Báo in mới nhất</h2>
      <p><a href="/bao-in">Xem tất cả các số báo in →</a></p>
      <div id="epaper-more" class="epaper-grid">Đang tải danh sách báo in…</div>
    </section>
  </div>
  <!-- Quang cao web_home_under_focus 1200x146 — Ngang toan bo sau vung than trang -->
  <div class="ad-slot" data-ad-placement="web_home_under_focus" hidden></div>
  <!-- Quang cao home_sidebar (FALLBACK): trang chu khong co cot sidebar,
       nen slot dat cuoi cot chinh thay vi doi bo cuc trang -->
  <div class="ad-slot" data-ad-placement="home_sidebar" hidden></div>
</main>

<!-- @FOOTER -->
<script src="/js/ads.js?v=20261102-1"></script>
<script src="/js/telemetry.js?v=20261105-1"></script>
<script src="/js/header.js?v=20261105-2"></script>
<script src="/js/home.js?v=20261105-3"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<script src="/js/stream-player.js?v=20261105-5"></script>
<script src="/js/live-controls.js?v=20261105-5"></script>
<script src="/js/live-epg.js?v=20261106-1"></script>
<script src="/js/multimedia.js?v=20261105-5"></script>
</body></html>
